name: Bug Report
description: File a bug report
labels: []
body:
    - type: markdown
      attributes:
          value: |
              **Notice:** While GitHub is the preferred channel for reporting issues/feedback, this is not a mechanism for receiving support under any agreement or SLA. If you require immediate assistance, please use official support channels.
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Also tell us, what did you expect to happen?
          placeholder: Tell us what you see!
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: How do you trigger this bug? Please walk us through it step by step.
          value: |
              1.
              2.
              3.
      validations:
          required: true
    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          description: Add any other context about the problem here, such as screenshots or related issues.
    - type: input
      id: extension-version
      attributes:
          label: Agentforce Vibes version
          description: From the Extensions view, or the top of "Copy Diagnostics". 4.x is a full replatform, so reports against older versions may already be fixed.
          placeholder: "4.11.0"
      validations:
          required: true
    - type: textarea
      id: diagnostics
      attributes:
          label: Diagnostics
          description: "Run `Cmd/Ctrl+Shift+P` -> `Agentforce: Copy Diagnostics` and paste the output. It is PII-scrubbed and includes the extension version, editor/OS, and a digest of recent failures. Please review before sharing."
          render: text
      validations:
          required: false
